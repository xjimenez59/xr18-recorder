name: Image Raspberry Pi

# Construit l'image à flasher (Raspberry Pi OS Lite 32 bits + enregistreur XR18).
# Déclenchement : publication d'une version (tag vX.Y.Z) ou lancement manuel.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]   # 3.13 = version de Raspberry Pi OS Trixie
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests

  image:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version de l'image
        run: echo "IMAGE_VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"

      # Base figée (même image à chaque construction) et vérifiée par sa somme SHA-256.
      # Pour passer à une version plus récente : changer BASE_DIR et BASE_FILE (voir downloads.raspberrypi.com).
      - name: Image de base Raspberry Pi OS Lite (Trixie, 32 bits)
        run: |
          BASE_DIR=https://downloads.raspberrypi.com/raspios_lite_armhf/images/raspios_lite_armhf-2026-10-06
          BASE_FILE=2026-10-06-raspios-trixie-armhf-lite.img.xz
          mkdir -p "$RUNNER_TEMP/base" && cd "$RUNNER_TEMP/base"
          curl -fsSLO "$BASE_DIR/$BASE_FILE"
          curl -fsSLO "$BASE_DIR/$BASE_FILE.sha256"
          sha256sum -c "$BASE_FILE.sha256"
          echo "BASE_IMAGE=file://$PWD/$BASE_FILE" >> "$GITHUB_ENV"

      - name: Personnalisation de Raspberry Pi OS Lite (32 bits, émulation ARM)
        id: build
        uses: pguyot/arm-runner-action@v2
        with:
          base_image: ${{ env.BASE_IMAGE }}
          image_additional_mb: 512
          copy_repository_path: /opt/xr18rec-src
          import_github_env: true
          shell: bash
          commands: |
            bash image/customize.sh

      - name: Compression
        run: |
          out="xr18rec-${IMAGE_VERSION}.img"
          sudo mv "${{ steps.build.outputs.image }}" "$out"
          sudo chown "$USER" "$out"
          xz -T0 -6 "$out"
          sha256sum "$out.xz" > "$out.xz.sha256"
          ls -lh xr18rec-*

      # Mise à jour sans reflashage : petit paquet signé (voir docs/mise-a-jour.md). La clé privée vient du secret
      # UPDATE_SIGNING_KEY ; sans elle (ou sans numéro de version X.Y.Z), seule l'image est produite.
      - name: Paquet de mise à jour signé
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          ver="${IMAGE_VERSION#v}"
          if [ -z "$UPDATE_SIGNING_KEY" ]; then echo "::warning::secret UPDATE_SIGNING_KEY absent : pas de paquet de mise à jour"; exit 0; fi
          if ! echo "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "::notice::version « $ver » non publiable : pas de paquet de mise à jour"; exit 0; fi
          notes="$(git tag -l --format='%(contents:subject)' "v$ver")"
          (umask 077; printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/update-key.pem")
          python3 scripts/make_update_package.py --version "$ver" --key "$RUNNER_TEMP/update-key.pem" --out dist --notes "$notes"
          rm -f "$RUNNER_TEMP/update-key.pem"
          # contrôle : le paquet doit être accepté par la clé publique de l'image
          XR18REC_UPDATE_PUBKEY=image/files/update-key.pub python3 -m xr18rec update inspect "dist/xr18rec-update-$ver.tar"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: xr18rec-image
          path: |
            xr18rec-*.img.xz
            xr18rec-*.img.xz.sha256
            dist/xr18rec-update-*.tar
          if-no-files-found: error
          retention-days: 14
          compression-level: 0   # déjà compressé

      - name: Publication de la version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Enregistreur XR18 ${{ github.ref_name }}
          body: |
            Image à flasher sur une carte SD pour Raspberry Pi 2 B (Raspberry Pi OS Lite 32 bits, Debian 13 « Trixie »).

            1. Télécharger `xr18rec-*.img.xz` (inutile de le décompresser) ; vérification possible avec le fichier `.sha256`.
            2. Flasher avec Raspberry Pi Imager (« Utiliser personnalisé ») ou balenaEtcher ; refuser la personnalisation proposée.
            3. Éditer `xr18rec.json` sur la partition `bootfs` (adresse de l'XR18), ou le faire ensuite dans la page ⚙ Paramètres.
            4. Brancher (Ethernet, XR18 en USB, disque USB) puis ouvrir http://xr18rec.local/

            **Mise à jour sans reflashage** (depuis une image `v0.3.0` ou plus récente) : télécharger `xr18rec-update-*.tar`, le copier à la racine d'un disque USB branché ou l'envoyer depuis ⚙ Paramètres. Voir [docs/mise-a-jour.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/mise-a-jour.md).

            Détails : [docs/installation-image.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/installation-image.md).
            **Version non testée sur matériel** : voir la section « À vérifier » de ce document.
          files: |
            xr18rec-*.img.xz
            xr18rec-*.img.xz.sha256
            dist/xr18rec-update-*.tar
