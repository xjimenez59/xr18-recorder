<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enregistreur XR18</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<h1>Enregistreur XR18</h1>

<div class="card">
  <div class="row"><span id="state" class="state">…</span><span id="session" class="muted"></span></div>
  <div class="timerow">
    <div class="big" id="elapsed">00:00:00</div>
    <button id="recbtn" class="recbtn" disabled>● REC</button>
  </div>
  <div class="muted">Disque libre : <b id="free">?</b> Gio · Dépassements : <b id="overruns">0</b></div>
  <div class="muted" id="cfg"></div>
  <div class="err" id="error"></div>
  <input type="text" id="name" class="namefield" placeholder="Nom de la session (facultatif)" maxlength="60">
  <div style="margin-top:12px; text-align:right"><a class="btn ghost" id="manage" href="/rec">Sessions et stockage ›</a></div>
</div>

<div class="card">
  <b>Retours des musiciens</b>
  <div style="margin-top:8px; text-align:center">
    <img src="/qr/mix.svg" alt="QR code de la page des retours" width="170" height="170" style="display:block; margin:0 auto 8px; background:#fff; border-radius:8px">
    <a id="mixlink" href="/mix" style="overflow-wrap:anywhere">/mix</a>
    <div class="muted">Scanner avec le téléphone, ou saisir cette adresse.</div>
  </div>
</div>

<div class="card" id="mutecard" hidden>
  <b>Mute</b>
  <div class="mutes">
    <button class="mutebtn" id="mute-buses" disabled></button>
    <button class="mutebtn" id="mute-main" disabled></button>
  </div>
  <div class="err" id="muteerr"></div>
</div>

<script src="/static/app.js"></script>
<script>
$('mixlink').textContent = location.origin + '/mix';

// Mute général : deux boutons « allumés » quand la sortie est coupée (état relu sur la console)
const MUTES = {
  buses: {el: 'mute-buses', on: ['🎧', 'Retours in-ear', 'actifs'], off: ['🔇', 'Retours COUPÉS', 'toucher pour rétablir'], part: ['⚠️', 'Retours en partie coupés', 'toucher pour tout couper']},
  main:  {el: 'mute-main',  on: ['🔊', 'Mix général', 'actif'],     off: ['🔇', 'Mix général COUPÉ', 'toucher pour rétablir'], part: null},
};
let muteState = null;
function renderMute(d) {
  muteState = d;
  for (const [target, m] of Object.entries(MUTES)) {
    const st = d[target], b = $(m.el);
    const [icon, title, sub] = !st.available ? ['⛔', target === 'main' ? 'Mix général' : 'Retours in-ear', 'indisponible']
      : st.muted ? m.off : st.partial && m.part ? m.part : m.on;
    b.replaceChildren();
    const t = document.createElement('b'); t.textContent = `${icon} ${title}`;
    const u = document.createElement('small'); u.textContent = sub;
    b.append(t, u);
    b.className = 'mutebtn' + (st.available && st.muted ? ' lit' : st.partial ? ' partial' : '');
    b.disabled = !st.available;
  }
  $('mutecard').hidden = false;
}
async function pollMute() {
  try { renderMute(await api('/api/mute')); $('muteerr').textContent = ''; }
  catch (e) { if (!muteState) $('mutecard').hidden = true; else $('muteerr').textContent = e.message; }
}
for (const [target, m] of Object.entries(MUTES)) {
  $(m.el).onclick = async () => {
    const st = muteState && muteState[target];
    if (!st) return;
    try { renderMute(await api('/api/mute', {target, muted: !st.muted})); $('muteerr').textContent = ''; }
    catch (e) { $('muteerr').textContent = e.message; }
  };
}
pollMute(); setInterval(pollMute, 2000);
const controls = initRecordControls();
pollStatus(controls.render);
setInterval(() => pollStatus(controls.render), 1000);
</script>
</body>
</html>
