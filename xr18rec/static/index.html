<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enregistreur XR18</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<h1>Enregistreur XR18</h1>

<div class="card">
  <div class="row"><span id="state" class="state">…</span><span id="session" class="muted"></span></div>
  <div class="timerow">
    <div class="big" id="elapsed">00:00:00</div>
    <button id="recbtn" class="recbtn" disabled>● REC</button>
  </div>
  <div class="muted">Disque libre : <b id="free">?</b> Gio · Dépassements : <b id="overruns">0</b></div>
  <div class="muted" id="cfg"></div>
  <div class="err" id="error"></div>
  <input type="text" id="name" class="namefield" placeholder="Nom de la session (facultatif)" maxlength="60">
  <div style="margin-top:12px; display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap">
    <a class="btn ghost" id="manage" href="/rec">Sessions et stockage ›</a>
  </div>
</div>

<div class="card" id="levelscard">
  <div class="row" style="justify-content:space-between">
    <b>Niveaux</b><span class="muted" id="lvlstate"></span>
  </div>
  <div class="meters" id="meters" hidden></div>
  <div class="lvlwarn" id="lvlwarn"></div>
  <div class="muted" id="lvlok"></div>
  <div class="row" style="margin-top:8px">
    <button class="ghost" id="lvlmon">Écouter les niveaux</button>
    <button class="ghost" id="lvlreset" hidden>Remise à zéro des crêtes</button>
  </div>
</div>

<div class="card">
  <b>Retours des musiciens</b>
  <div style="margin-top:8px; text-align:center">
    <img src="/qr/mix.svg" alt="QR code de la page des retours" width="170" height="170" style="display:block; margin:0 auto 8px; background:#fff; border-radius:8px">
    <a id="mixlink" href="/mix" style="overflow-wrap:anywhere">/mix</a>
    <div class="muted">Scanner avec le téléphone, ou saisir cette adresse.</div>
  </div>
</div>

<div class="card" id="mutecard" hidden>
  <b>Mute</b>
  <div class="mutes">
    <button class="mutebtn" id="mute-buses" disabled></button>
    <button class="mutebtn" id="mute-main" disabled></button>
  </div>
  <div class="err" id="muteerr"></div>
</div>

<div class="muted" id="nohost" hidden style="text-align:center">
  Console XR18 non configurée : <a href="/settings">saisir son adresse dans les paramètres</a>.
</div>

<div style="text-align:center; margin:4px 0 20px">
  <a class="gear" href="/settings" aria-label="Paramètres" title="Paramètres">⚙</a>
</div>

<script src="/static/app.js"></script>
<script>
$('mixlink').textContent = location.origin + '/mix';

// Mute général : deux boutons « allumés » quand la sortie est coupée (état relu sur la console)
const MUTES = {
  buses: {el: 'mute-buses', on: ['🎧', 'Retours in-ear', 'actifs'], off: ['🔇', 'Retours COUPÉS', 'toucher pour rétablir'], part: ['⚠️', 'Retours en partie coupés', 'toucher pour tout couper']},
  main:  {el: 'mute-main',  on: ['🔊', 'Mix général', 'actif'],     off: ['🔇', 'Mix général COUPÉ', 'toucher pour rétablir'], part: null},
};
let muteState = null;
function renderMute(d) {
  muteState = d;
  for (const [target, m] of Object.entries(MUTES)) {
    const st = d[target], b = $(m.el);
    const [icon, title, sub] = !st.available ? ['⛔', target === 'main' ? 'Mix général' : 'Retours in-ear', 'indisponible']
      : st.muted ? m.off : st.partial && m.part ? m.part : m.on;
    b.replaceChildren();
    const t = document.createElement('b'); t.textContent = `${icon} ${title}`;
    const u = document.createElement('small'); u.textContent = sub;
    b.append(t, u);
    b.className = 'mutebtn' + (st.available && st.muted ? ' lit' : st.partial ? ' partial' : '');
    b.disabled = !st.available;
  }
  $('mutecard').hidden = false;
}
async function pollMute() {
  try { renderMute(await api('/api/mute')); $('muteerr').textContent = ''; $('nohost').hidden = true; }
  catch (e) {
    if (!muteState) $('mutecard').hidden = true; else $('muteerr').textContent = e.message;
    $('nohost').hidden = !/non configuré/.test(e.message);  // première installation : adresse de l'XR18 à saisir
  }
}
for (const [target, m] of Object.entries(MUTES)) {
  $(m.el).onclick = async () => {
    const st = muteState && muteState[target];
    if (!st) return;
    try { renderMute(await api('/api/mute', {target, muted: !st.muted})); $('muteerr').textContent = ''; }
    catch (e) { $('muteerr').textContent = e.message; }
  };
}
pollMute(); setInterval(pollMute, 2000);
// Vumètres : niveau de crête de chaque voie (dB pleine échelle), crête mémorisée, témoin de saturation.
// Source : la prise en cours, un contrôle avant la prise (bouton « Écouter »), ou la dernière prise.
const dbPct = db => db === null ? 0 : Math.max(0, Math.min(100, (db + 60) / 60 * 100));
const MODE_TEXT = {recording: 'en direct (prise)', monitor: 'contrôle en direct', last: 'dernière prise', none: ''};
let meterCount = 0, lvlMode = 'none';
function buildMeters(names) {
  const box = $('meters'); box.replaceChildren(); meterCount = names.length;
  names.forEach((name, i) => {
    const m = document.createElement('div'); m.className = 'meter'; m.title = name;
    const led = document.createElement('div'); led.className = 'led';
    const bar = document.createElement('div'); bar.className = 'bar';
    const fill = document.createElement('div'); fill.className = 'fill';
    const hold = document.createElement('div'); hold.className = 'hold';
    bar.append(fill, hold);
    const lab = document.createElement('small'); lab.textContent = i < 16 ? String(i + 1) : (i === 16 ? 'L' : i === 17 ? 'R' : String(i + 1));
    m.append(led, bar, lab); box.append(m);
  });
}
function renderLevels(d) {
  lvlMode = d.mode;
  $('lvlstate').textContent = MODE_TEXT[d.mode] || '';
  const mon = $('lvlmon');
  mon.hidden = d.mode === 'recording';  // pendant la prise, les niveaux sont déjà affichés
  mon.textContent = d.mode === 'monitor' ? 'Arrêter le contrôle' : 'Écouter les niveaux';
  $('lvlreset').hidden = !d.has_data;
  $('meters').hidden = !d.has_data;
  if (!d.has_data) {
    $('lvlwarn').textContent = '';
    $('lvlok').textContent = d.monitor_error ? '⚠ ' + d.monitor_error
      : d.mode === 'monitor' ? 'Contrôle en cours… en attente du signal.'
      : 'Écouter les niveaux avant la prise : REC reste possible à tout moment (le contrôle s’arrête alors tout seul).';
    return;
  }
  if (meterCount !== d.channels.length) buildMeters(d.names);
  const cols = $('meters').children, bad = [];
  d.channels.forEach((c, i) => {
    const m = cols[i], fill = m.querySelector('.fill'), hold = m.querySelector('.hold');
    fill.style.height = dbPct(d.active ? c.window_db : null) + '%';
    fill.className = 'fill' + (c.window_db !== null && c.window_db >= -6 ? ' hot' : c.window_db !== null && c.window_db >= -18 ? ' mid' : '');
    hold.style.bottom = dbPct(c.peak_db) + '%'; hold.style.display = c.peak_db === null ? 'none' : '';
    m.querySelector('.led').className = 'led' + (c.clipped ? ' clip' : '');
    m.classList.toggle('clipped', c.clipped);
    m.title = `${d.names[i]} : crête ${c.take_peak_db === null ? '−∞' : c.take_peak_db + ' dB'}` + (c.clipped ? ' — SATURÉE' : '');
    if (c.clipped) bad.push(`${d.names[i]}${d.mode !== 'monitor' && c.events.length ? ' (' + fmt(c.events[0]) + ')' : ''}`);
  });
  $('lvlwarn').textContent = bad.length ? '⚠ Saturation : ' + bad.join(', ') : '';
  const partial = d.skipped_s > 0 ? ` Analyse partielle : ${Math.round(d.skipped_s)} s non analysées (Pi trop chargé).` : '';
  const none = d.mode === 'recording' ? 'Aucune saturation pour le moment.' : d.mode === 'monitor' ? 'Aucune saturation.' : 'Aucune saturation pendant la prise.';
  const load = d.load_pct >= 50 ? ` Analyse des niveaux : ${Math.round(d.load_pct)} % d’un cœur du Pi.` : '';
  $('lvlok').textContent = (bad.length ? '' : none) + partial + load + (d.monitor_error ? ' ⚠ ' + d.monitor_error : '');
}
async function pollLevels() {
  let wait = 3000;
  try { const d = await api('/api/levels'); renderLevels(d); wait = d.active ? 250 : 3000; } catch (e) { /* on réessaie */ }
  setTimeout(pollLevels, wait);
}
$('lvlreset').onclick = async () => { try { renderLevels(await api('/api/levels/reset', {})); } catch (e) { /* ignoré */ } };
$('lvlmon').onclick = async () => {
  try { renderLevels(await api('/api/levels/monitor', {on: lvlMode !== 'monitor'})); }
  catch (e) { $('lvlok').textContent = '⚠ ' + e.message; }
};
pollLevels();

const controls = initRecordControls();
pollStatus(controls.render);
setInterval(() => pollStatus(controls.render), 1000);
</script>
</body>
</html>
